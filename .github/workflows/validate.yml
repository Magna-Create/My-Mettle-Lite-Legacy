name: Validate

"on":
  workflow_dispatch:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  web:
    name: Test and build web app
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run tests
        id: tests
        shell: bash
        run: |
          set +e
          npm test > test-output.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 180 test-output.log
            exit "$status"
          fi
          cat test-output.log
      - name: Upload test failure log
        if: failure() && steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: test-failure-log
          path: test-output.log
          if-no-files-found: error
          retention-days: 3
      - name: Build production bundle
        id: web-build
        shell: bash
        run: |
          set +e
          npm run build > build-output.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 180 build-output.log
            exit "$status"
          fi
          cat build-output.log
      - name: Upload build failure log
        if: failure() && steps.web-build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: web-build-failure-log
          path: build-output.log
          if-no-files-found: error
          retention-days: 3

  android:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    needs: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install NDK and CMake for open JNI bridge
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Build ARM64 GenieX JNI bridge
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$GITHUB_WORKSPACE/android/app/src/main/cpp/geniex"
          build_dir="$RUNNER_TEMP/mais-geniex-build"
          cmake_bin="$ANDROID_SDK_ROOT/cmake/3.22.1/bin/cmake"
          ndk_dir="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          "$cmake_bin" \
            -S "$source_dir" \
            -B "$build_dir" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ndk_dir/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_shared
          "$cmake_bin" --build "$build_dir" --config Release --parallel 2
          destination="$GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$destination"
          cp "$build_dir/libmais_geniex.so" "$destination/libmais_geniex.so"
          file "$destination/libmais_geniex.so"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build and synchronise Capacitor
        run: npm run android:sync
      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew
      - name: Assemble debug APK
        id: android-build
        working-directory: android
        shell: bash
        run: |
          set +e
          ./gradlew assembleDebug --no-daemon > android-build-output.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 220 android-build-output.log
            exit "$status"
          fi
          cat android-build-output.log
      - name: Verify GenieX bridge is packaged
        shell: bash
        run: |
          set -euo pipefail
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep 'lib/arm64-v8a/libmais_geniex.so'
      - name: Vendor compiled bridge on agent branch
        if: github.event_name == 'push' && startsWith(github.ref_name, 'agent/')
        shell: bash
        run: |
          set -euo pipefail
          binary="$GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a/libmais_geniex.so"
          staged="$RUNNER_TEMP/libmais_geniex.so"
          cp "$binary" "$staged"
          git fetch origin "$GITHUB_REF_NAME"
          git checkout -B "$GITHUB_REF_NAME" "origin/$GITHUB_REF_NAME"
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp "$staged" android/app/src/main/jniLibs/arm64-v8a/libmais_geniex.so
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/jniLibs/arm64-v8a/libmais_geniex.so
          if git diff --cached --quiet; then
            echo "GenieX bridge binary is already current."
          else
            git commit -m "Vendor ARM64 GenieX JNI bridge"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Upload Android failure log
        if: failure() && steps.android-build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: android-build-failure-log
          path: android/android-build-output.log
          if-no-files-found: error
          retention-days: 3
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: my-mettle-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
