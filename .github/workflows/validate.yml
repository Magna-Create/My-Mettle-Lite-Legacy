name: Validate

"on":
  workflow_dispatch:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
    branches:
      - main

jobs:
  web:
    name: Test and build web app
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run tests
        id: tests
        shell: bash
        run: |
          set +e
          npm test > test-output.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 180 test-output.log
            exit "$status"
          fi
          cat test-output.log
      - name: Upload test failure log
        if: failure() && steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: test-failure-log
          path: test-output.log
          if-no-files-found: error
          retention-days: 3
      - name: Build production bundle
        id: web-build
        shell: bash
        run: |
          set +e
          npm run build > build-output.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 180 build-output.log
            exit "$status"
          fi
          cat build-output.log
      - name: Upload build failure log
        if: failure() && steps.web-build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: web-build-failure-log
          path: build-output.log
          if-no-files-found: error
          retention-days: 3

  android:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    needs: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build and synchronise Capacitor
        run: npm run android:sync
      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew
      - name: Assemble debug APK
        id: android-build
        working-directory: android
        shell: bash
        run: |
          set +e
          ./gradlew assembleDebug --no-daemon > android-build-output.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 260 android-build-output.log
            exit "$status"
          fi
          cat android-build-output.log
      - name: Verify bundled GenieX runtime
        shell: bash
        run: |
          set -euo pipefail
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -E 'lib/arm64-v8a/lib(npu_jni|geniex_plugin_qairt)\.so'
      - name: Upload Android failure log
        if: failure() && steps.android-build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: android-build-failure-log
          path: android/android-build-output.log
          if-no-files-found: error
          retention-days: 3
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: my-mettle-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
