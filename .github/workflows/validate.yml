name: Validate

"on":
  workflow_dispatch:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
    branches:
      - main

jobs:
  web:
    name: Test and build web app
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run tests
        id: tests
        shell: bash
        run: |
          set +e
          npm test > test-output.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 180 test-output.log
            exit "$status"
          fi
          cat test-output.log
      - name: Upload test failure log
        if: failure() && steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: test-failure-log
          path: test-output.log
          if-no-files-found: error
          retention-days: 3
      - name: Build production bundle
        id: web-build
        shell: bash
        run: |
          set +e
          npm run build > build-output.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 180 build-output.log
            exit "$status"
          fi
          cat build-output.log
      - name: Upload build failure log
        if: failure() && steps.web-build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: web-build-failure-log
          path: build-output.log
          if-no-files-found: error
          retention-days: 3

  android:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    needs: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build and synchronise Capacitor
        run: npm run android:sync
      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew
      - name: Assemble debug APK
        id: android-build
        working-directory: android
        shell: bash
        run: |
          set +e
          ./gradlew assembleDebug --no-daemon > android-build-output.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 220 android-build-output.log
            exit "$status"
          fi
          cat android-build-output.log
      - name: Inspect localagents-rag embedding API
        if: always()
        working-directory: android
        shell: bash
        run: |
          set +e
          report="$GITHUB_WORKSPACE/embedding-api-diagnostic.txt"
          {
            echo "Resolved localagents-rag files:"
            find "$HOME/.gradle/caches/modules-2/files-2.1/com.google.ai.edge.localagents/localagents-rag/0.3.0" -type f -print 2>&1
            aar="$(find "$HOME/.gradle/caches/modules-2/files-2.1/com.google.ai.edge.localagents/localagents-rag/0.3.0" -type f -name '*.aar' | head -n 1)"
            echo "AAR: $aar"
            if [ -n "$aar" ]; then
              unzip -p "$aar" classes.jar > /tmp/localagents-rag-classes.jar
              echo
              echo "Matching classes:"
              jar tf /tmp/localagents-rag-classes.jar | grep -E 'GemmaEmbeddingModel|EmbeddingModel' || true
              echo
              echo "GemmaEmbeddingModel API and bytecode:"
              javap -classpath /tmp/localagents-rag-classes.jar -p -c com.google.ai.edge.localagents.rag.models.GemmaEmbeddingModel 2>&1
            fi
          } > "$report" 2>&1
          cat "$report"
          exit 0
      - name: Upload EmbeddingGemma API diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: embedding-api-diagnostic
          path: embedding-api-diagnostic.txt
          if-no-files-found: error
          retention-days: 3
      - name: Upload Android failure log
        if: failure() && steps.android-build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: android-build-failure-log
          path: android/android-build-output.log
          if-no-files-found: error
          retention-days: 3
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: my-mettle-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
